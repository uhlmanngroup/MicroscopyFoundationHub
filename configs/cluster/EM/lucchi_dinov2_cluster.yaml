# Environment: cluster (UZH Science) - Lucchi++ segmentation run

extends: defaults

# ---- I/O ----
# DINO-POC (optional):
# train_img_dir: ${data_root}/EM/DINO-POC/train/images
# train_mask_dir: ${data_root}/EM/DINO-POC/train/masks
# test_img_dir:    ${data_root}/EM/DINO-POC/test/images
# test_mask_dir:   ${data_root}/EM/DINO-POC/test/masks
# Lucchi++:
train_img_dir: "${data_root}/EM/Lucchi++/Train_In"
train_mask_dir: "${data_root}/EM/Lucchi++/Train_Out"
test_img_dir:    "${data_root}/EM/Lucchi++/Test_In"
test_mask_dir:   "${data_root}/EM/Lucchi++/Test_Out"

# results + experiment naming (stored under /data to persist on the cluster)
experiment_id: "2026-01-19_dinov2-ablationstudy-base_seg"
results_root: "${results_root}/dinov2"
task_type: "ablationstudy"

# dataset pairing (Lucchi images are named maskXXXX vs masks as digits)
dataset:
  type: lucchi
  params:
    recursive: false
    image_prefix: "mask"
    zfill_width: 4

# ---- model / backbone ----
backbone:
  name: dinov2
  variant: base
  load_backend: torchhub
  weights: null
  repo_dir: null
  preprocess:
    preset: em
dino_size: base
img_size:
  mode: longest_edge
  target: 1022   # largest <= 1024 while staying multiple of 14
  patch_multiple: 14
  rounding: floor
num_classes: 2

# ---- LoRA ----
use_lora: true
lora_targets: [attn.qkv, attn.proj]

# ---- training ----
batch_size: 1          # tightened for low-memory smoke tests on standard GPUs
num_workers: 0
amp: false            # first run: stability check without AMP

# ---- loss (CE + Tversky on foreground) ----
loss: dice      # ce, dice, ce_tversky 
class_weights: [1.0, 15.0]    # bg, fg
tversky_weight: 0.6   # lambda: 0.6*Tversky + 0.4*CE

# ---- training safety ----
clip_grad_norm: 1.0   # global grad clip
