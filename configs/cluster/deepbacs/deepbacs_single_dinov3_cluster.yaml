# Environment: cluster (UZH Science) - DeepBacs single dataset

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/deepbacs/single/subtilis/train/images"
train_mask_dir: "${data_root}/deepbacs/single/subtilis/train/masks"
test_img_dir: "${data_root}/deepbacs/single/subtilis/test/images"
test_mask_dir: "${data_root}/deepbacs/single/subtilis/test/masks"

# ---- results ----
experiment_id: "2026-03-03_deepbacs_subtilis_dinov3_lora_seg"
results_root: "${scratch_root}/dinov3"
task_type: "seg/single/subtilis-lora"
modality: "deepbacs"

dataset:
  type: paired
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: dinov3
  variant: vitl16
  load_backend: torchhub
  repo_dir: ${dinov3_repo}
  weights: ${models_root}/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  preprocess:
    preset: em
dino_size: vitl16
img_size:
  mode: native
num_classes: 2

# ---- fine-tuning ----
use_lora: true
# Current LoRA setting for new runs; completed runs keep their saved configs.
lora_rank: 16
lora_alpha: 32

full_finetune: false

# ---- safety / export ----
binarize_threshold: 0
