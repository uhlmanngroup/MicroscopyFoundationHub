# Environment: cluster (UZH Science) - DeepBacs paired dataset with optional balanced batching

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/deepbacs/paired/coli-aureus/train/images"
train_mask_dir: "${data_root}/deepbacs/paired/coli-aureus/train/masks"
test_img_dir: "${data_root}/deepbacs/paired/coli-aureus/test/images"
test_mask_dir: "${data_root}/deepbacs/paired/coli-aureus/test/masks"

# ---- results ----
experiment_id: "2026-03-24_deepbacs_paired_coli-aureus_dinov2_balance_ablation"
results_root: "${results_root}/dinov2"
task_type: "seg/paired/coli-aureus-frozen-balanced"
modality: "deepbacs"
paired_dataset_name: "coli-aureus"

dataset:
  type: paired
  params:
    pair_mode: stem
    recursive: false

# ---- balanced sampling ----
# Balanced batches enforce batch_size=2 and yield exactly one sample from each source.
# The script infers the source split from `paired_dataset_name` (or from train_img_dir if omitted).
# Canonical source names in the composed datasets are:
#   aureus, coli, subtilis
balanced_sampling:
  match_source: stem

# ---- model / backbone ----
backbone:
  name: dinov2
  variant: base
  load_backend: torchhub
  weights: null
  repo_dir: null
  preprocess:
    preset: em
dino_size: base
img_size:
  mode: native
num_classes: 2

# ---- fine-tuning ----
# Use the script CLI to switch between frozen and LoRA:
#   --tuning-mode frozen
#   --tuning-mode lora
use_lora: false
full_finetune: false

# ---- safety / export ----
binarize_threshold: 0
