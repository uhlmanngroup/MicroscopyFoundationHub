# Environment: cluster (UZH Science) - paired Lucchi++ + Droso dataset
# Edit paths + results_root as needed.

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/EM/DINO-POC/train/images"
train_mask_dir: "${data_root}/EM/DINO-POC/train/masks"
test_img_dir: "${data_root}/EM/DINO-POC/test/images"
test_mask_dir: "${data_root}/EM/DINO-POC/test/masks"

# results + experiment naming
experiment_id: "ablation_paired_balance_dinov2"
results_root: "${results_root}/dinov2"
task_type: "seg"

# paired dataset (filenames include 'lucchi' or 'droso')
dataset:
  type: paired
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: dinov2
  variant: base
  load_backend: torchhub
  weights: null
  repo_dir: null
  preprocess:
    preset: em
dino_size: base
img_size:
  mode: longest_edge
  target: 1022
  patch_multiple: 14
  rounding: floor
num_classes: 2

# ---- LoRA ----
use_lora: false
lora_targets: [attn.qkv, attn.proj]

# ---- training (override via CLI or sbatch env vars if needed) ----
seed: 0

# ---- loss ----
class_weights: [1.0, 15.0]

# ---- export / viz ----

# NOTE: this config never set clip_grad_norm, so it ran with clipping disabled
# (code fallback 0.0). Pinned explicitly to preserve that.
clip_grad_norm: 0.0
