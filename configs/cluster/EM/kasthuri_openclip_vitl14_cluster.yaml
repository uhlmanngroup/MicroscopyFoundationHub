# Environment: cluster (UZH Science) — Kasthuri++ only, OpenCLIP ViT-L-14.
#
# Regime-agnostic base; the sweep supplies --tuning-mode head|lora|fullft.
# Supersedes kasthuri_openclip_vitl14_{head,lora,fullft}_cluster.yaml, which encoded
# one regime each and predate configs/defaults.yaml.

extends: defaults

# ---- I/O ----
train_img_dir:  "${data_root}/EM/Kasthuri++/Train_In"
train_mask_dir: "${data_root}/EM/Kasthuri++/Train_Out"
test_img_dir:   "${data_root}/EM/Kasthuri++/Test_In"
test_mask_dir:  "${data_root}/EM/Kasthuri++/Test_Out"

# ---- results ----
experiment_id: "2026-09-23_em_kasthuri_openclip_vitl14_seg"
results_root: "${scratch_root}/openclip"
task_type: "seg/kasthuri"
modality: em

# Kasthuri follows Lucchi-style pairing (numeric stems; no image prefix)
dataset:
  type: lucchi
  params:
    recursive: false
    image_prefix: ""
    zfill_width: 4

# ---- model / backbone ----
backbone:
  name: openclip
  model: "ViT-L-14"
  variant: "ViT-L-14"
  pretrained: "laion2b_s32b_b82k"
  weights: ""
  preprocess:
    preset: em
dino_size: "ViT-L-14"
img_size:
  mode: longest_edge
  target: 1022
  patch_multiple: 14
  rounding: floor
num_classes: 2

# ---- LoRA ----
lora_rank: 16
lora_alpha: 32
lora:
  target_policy: vit_attention_only
  layer_selection: all
  exclude: [head, decoder, seg_head]
  compatibility_mode: true

# ---- loss (Dice) ----
class_weights: [1.0, 15.0]
