# Environment: cluster (UZH Science) - composed DINO-POC dataset
# DINOv2 baseline config.

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/EM/TRIPLET/train/images"
train_mask_dir: "${data_root}/EM/TRIPLET/train/masks"
test_img_dir:    "${data_root}/EM/TRIPLET/test/images"
test_mask_dir:   "${data_root}/EM/TRIPLET/test/masks"

# results + experiment naming
experiment_id: "2025-02-23_TRIPLET_dinov2_frozen_seg"
results_root: "${results_root}/dinov2/seg"
task_type: "triplet-lora"

dataset:
  type: paired          # use generic PairedDirsSegDataset
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: dinov2
  variant: base
  load_backend: torchhub
  weights: null
  repo_dir: null
  preprocess:
    preset: em
dino_size: base
img_size:
  mode: longest_edge
  target: 1022   # largest <= 1024 while staying multiple of 14
  patch_multiple: 14
  rounding: floor
num_classes: 2

# ---- fine-tuning ----
use_lora: true
# NOTE: these runs used the implicit LoRA fallback (rank 8, alpha 16), not the
# rank 16 / alpha 32 used by the EM and OpenCLIP configs. Pinned explicitly so the
# value is visible and unchanged; see git history before altering.
lora_rank: 8
lora_alpha: 16

full_finetune: false

# ---- training safety ----
clip_grad_norm: 1.0   # global grad clip
