# Feature and domain analysis on paired Lucchi++/VNC test images.
#
# Results land under ${scratch_root}/dinov2/em/feat-analysis/.

experiment_id: "2026-10-27_paired_dinov2_large_features"
results_root: "${scratch_root}/dinov2"
task_type: "feat-analysis/paired"

data:
  data_dir: "${data_root}/EM/PAIRED_LUCCHI_VNC_17_3/test/images"
  expected_groups: 2

model:
  backbone:
    name: dinov2
    variant: large
    load_backend: torchhub
    weights: null
    repo_dir: null
    preprocess:
      preset: em
  dino_size: "large"
  checkpoint: null

runtime:
  batch_size: 2
  num_workers: 4
  img_size:
    mode: longest_edge
    target: 1022
    patch_multiple: 14
    rounding: floor
  device: "auto"

pca:
  n_components: 50
  plot_dims: [0, 1]
  whiten: false
  l2norm: false
  seed: 0

umap:
  enabled: true
  pca_dim: 50
  n_neighbors: 15
  min_dist: 0.1
  n_components: 2
  metric: "euclidean"
  seed: 0

clahe_norm: false

domain_analysis:
  mode: pairwise_all
  include_dataset_names: [lucchi, droso]
  n_components: 64
  seed: 0
  output_subdir: domain-analysis
  json_name: pairwise_metrics.json
  csv_name: pairwise_metrics.csv
  use_run_dir_metrics: false
