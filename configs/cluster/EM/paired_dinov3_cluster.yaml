# Environment: cluster (UZH Science) - composed DINO-POC dataset
# DINOv3 paired full fine-tuning config.

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/EM/TRIPLET/train/images"
train_mask_dir: "${data_root}/EM/TRIPLET/train/masks"
test_img_dir:   "${data_root}/EM/TRIPLET/test/images"
test_mask_dir:  "${data_root}/EM/TRIPLET/test/masks"

# results + experiment naming
experiment_id: "2025-02-26_TRIPLET_dinov3_fullft"
results_root: "${scratch_root}/dinov3/seg"
task_type: "triplet-fullft"

dataset:
  type: paired          # use generic PairedDirsSegDataset
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: dinov3
  variant: vitl16
  load_backend: torchhub
  repo_dir: ${dinov3_repo}
  weights: ${models_root}/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  preprocess:
    preset: em
dino_size: vitl16
img_size:
  mode: longest_edge
  target: 1022   # largest <= 1024 while staying multiple of 16
  patch_multiple: 16
  rounding: floor
num_classes: 2

# ---- fine-tuning ----
use_lora: false
full_finetune: true

# ---- training ----
epochs: 10000
patience: 20 # early stopping

# ---- training safety ----
clip_grad_norm: 1.0   # global grad clip

# ---- evaluation previews ----
eval_preview_mode: all   # all|random
eval_preview_cols: 4
