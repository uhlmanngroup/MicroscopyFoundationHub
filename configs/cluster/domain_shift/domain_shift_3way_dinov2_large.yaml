# Cluster domain-analysis config for explicit 3-way comparison:
#   EM vs DeepBacs vs OpenImages
#
# Edit before running on the cluster:
# - results_root
# - experiment_id (optional)
# - the three `npz` paths below if you change experiment ids / task types

experiment_id: "2026-03-30_domain_shift_3way_dinov2-large"
results_root: "${results_root}/dinov2"
task_type: "domain-analysis/3way"
modality: "multi"

domain_analysis:
  mode: pairwise_all
  domains:
    - name: em
      npz: "${results_root}/dinov2/em/feat-analysis/domain-shift/2026-03-30_domain_shift_em_dinov2-large/features.npz"
    - name: deepbacs
      npz: "${results_root}/dinov2/deepbacs/feat-analysis/domain-shift/2026-03-30_domain_shift_deepbacs_dinov2-large/features.npz"
    - name: openimages
      npz: "${results_root}/dinov2/openimages/feat-analysis/domain-shift/2026-03-30_domain_shift_openimages_dinov2-large/features.npz"
  n_components: 64
  seed: 0
  out_dir: "${results_root}/dinov2/multi/domain-analysis/3way/2026-03-30_domain_shift_3way_dinov2-large"
  json_name: "pairwise_metrics.json"
  csv_name: "pairwise_metrics.csv"
  use_run_dir_metrics: false

clahe_norm: false
