# Environment: cluster (UZH Science) - composed DINO-POC dataset
# OpenCLIP ViT-L-14 config.

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/EM/TRIPLET/train/images"
train_mask_dir: "${data_root}/EM/TRIPLET/train/masks"
test_img_dir:    "${data_root}/EM/TRIPLET/test/images"
test_mask_dir:   "${data_root}/EM/TRIPLET/test/masks"

# results + experiment naming
experiment_id: "2026-02-26_openclip_vitl14_triplet_fullft"
results_root: "${results_root}/openclip"
task_type: "seg/triplet-fullft"

# stitched dataset already shares a naming scheme between images/masks
dataset:
  type: paired
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: openclip
  model: "ViT-L-14"
  pretrained: "laion2b_s32b_b82k"
  weights: ""
  preprocess:
    preset: em
dino_size: "ViT-L-14"
img_size:
  mode: longest_edge
  target: 1022   # largest <= 1024 while staying multiple of 14
  patch_multiple: 14
  rounding: floor
num_classes: 2

# ---- LoRA ----
use_lora: false
lora:
  enabled: false
  target_policy: vit_attention_only
  layer_selection: all
  exclude: [head, decoder, seg_head]
  compatibility_mode: true

full_finetune: true

# ---- loss (Dice) ----
class_weights: [1.0, 15.0]
