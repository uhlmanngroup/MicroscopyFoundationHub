# Environment: cluster (UZH Science) - DeepBacs paired dataset

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/deepbacs/paired/coli-aureus/train/images"
train_mask_dir: "${data_root}/deepbacs/paired/coli-aureus/train/masks"
test_img_dir: "${data_root}/deepbacs/paired/coli-aureus/test/images"
test_mask_dir: "${data_root}/deepbacs/paired/coli-aureus/test/masks"

# ---- results ----
experiment_id: "2026-03-20_deepbacs_paired_coli-aureus_dinov2_lora_seg"
results_root: "${results_root}/dinov2"
task_type: "seg/paired/coli-aureus-lora"
modality: "deepbacs"

dataset:
  type: paired
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: dinov2
  variant: base
  load_backend: torchhub
  weights: null
  repo_dir: null
  preprocess:
    preset: em
dino_size: base
img_size:
  mode: native
num_classes: 2

# ---- fine-tuning ----
use_lora: true
# Current LoRA setting for new runs; completed runs keep their saved configs.
lora_rank: 16
lora_alpha: 32

full_finetune: false

# ---- safety / export ----
binarize_threshold: 0
