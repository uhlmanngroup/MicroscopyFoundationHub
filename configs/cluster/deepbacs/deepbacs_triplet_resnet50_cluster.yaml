# Environment: cluster (UZH Science) — DeepBacs joint (coli + aureus + subtilis),
# UNet/ResNet50 full fine-tune. The control condition: DeepBacs shares uniform
# saliency across species, so joint training is expected to stay stable — unlike EM.
# Mirrors deepbacs_triplet_dinov3_cluster.yaml; only the backbone and regime differ.
#
# NOTE: per-source metrics are switched on by the substring "triplet" appearing in
# train_img_dir / test_img_dir / experiment_id / task_type (see
# dino_peft.utils.sample_groups.infer_expected_group_count). Both the data paths and
# task_type below carry it. Without it, metrics.json holds ONE pooled IoU and the
# per-species breakdown this experiment depends on is silently absent.

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/deepbacs/triplet/train/images"
train_mask_dir: "${data_root}/deepbacs/triplet/train/masks"
test_img_dir: "${data_root}/deepbacs/triplet/test/images"
test_mask_dir: "${data_root}/deepbacs/triplet/test/masks"

# ---- results ----
experiment_id: "2026-09-22_deepbacs_triplet_resnet50-unet_fullft_seg"
results_root: "${scratch_root}/resnet50"
task_type: "seg/triplet/coli-aureus-subtilis-fullft"
modality: "deepbacs"

dataset:
  type: paired
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
# UNet decoder + ImageNet-supervised ResNet50 encoder — the CNN null-hypothesis
# control. modality: deepbacs forces img_size.mode=native and a paired 448x448
# centre crop, so every input is 448x448 (14 x 32, cleanly divisible by the
# encoder's total stride).
backbone:
  name: resnet50
  variant: resnet50
  pretrained: imagenet     # IMAGENET1K_V1; set to 'random' for the no-pretraining ablation
  preprocess:
    preset: em             # ImageNet mean/std — matches the encoder's pretraining
img_size:
  mode: native
num_classes: 2

# ---- fine-tuning ----
# End-to-end only. LoRA targets ViT attention projections and has no ResNet
# equivalent; a frozen conv encoder is a confounded comparison for dense prediction.
use_lora: false
full_finetune: true

# ---- safety / export ----
binarize_threshold: 0
