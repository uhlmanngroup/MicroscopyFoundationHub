# Environment: cluster (UZH Science) - DeepBacs triplet dataset

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/deepbacs/triplet/train/images"
train_mask_dir: "${data_root}/deepbacs/triplet/train/masks"
test_img_dir: "${data_root}/deepbacs/triplet/test/images"
test_mask_dir: "${data_root}/deepbacs/triplet/test/masks"

# ---- results ----
experiment_id: "2026-03-03_deepbacs_triplet_openclip_vitl14_lora_seg"
results_root: "${results_root}/openclip"
task_type: "seg/triplet/coli-aureus-subtilis-lora"
modality: "deepbacs"

dataset:
  type: paired
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: openclip
  model: "ViT-L-14"
  pretrained: "laion2b_s32b_b82k"
  weights: ""
  preprocess:
    preset: em
dino_size: "ViT-L-14"
img_size:
  mode: native
num_classes: 2

# ---- fine-tuning ----
use_lora: true
full_finetune: false
lora:
  enabled: true
  target_policy: vit_attention_only
  layer_selection: all
  exclude: [head, decoder, seg_head]
  compatibility_mode: true

# ---- safety / export ----
binarize_threshold: 0
