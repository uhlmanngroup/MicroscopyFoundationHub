# Environment: cluster (UZH Science) - Kasthuri-only segmentation run
# DINOv2 frozen-backbone (head-only) config.

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/EM/Kasthuri++/Train_In"
train_mask_dir: "${data_root}/EM/Kasthuri++/Train_Out"
test_img_dir:  "${data_root}/EM/Kasthuri++/Test_In"
test_mask_dir: "${data_root}/EM/Kasthuri++/Test_Out"

# results + experiment naming
experiment_id: "2026-02-27_kasthuri_dinov2_head_seg"
results_root: "${results_root}/dinov2/seg"
task_type: "kasthuri-head"

# Kasthuri follows Lucchi-style pairing (numeric stems; no image prefix)
dataset:
  type: lucchi
  params:
    recursive: false
    image_prefix: ""
    zfill_width: 4

# ---- model / backbone ----
backbone:
  name: dinov2
  variant: large
  load_backend: torchhub
  weights: null
  repo_dir: null
  preprocess:
    preset: em
dino_size: large
img_size:
  mode: longest_edge
  target: 1022
  patch_multiple: 14
  rounding: floor
num_classes: 2

# ---- fine-tuning ----
use_lora: false
full_finetune: false

# ---- loss ----
class_weights: [1.0, 15.0]
