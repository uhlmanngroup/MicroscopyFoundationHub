# Environment: cluster (UZH Science) - Kasthuri-only segmentation run
# OpenCLIP ViT-L-14 frozen-backbone (head-only) config.

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/EM/Kasthuri++/Train_In"
train_mask_dir: "${data_root}/EM/Kasthuri++/Train_Out"
test_img_dir:  "${data_root}/EM/Kasthuri++/Test_In"
test_mask_dir: "${data_root}/EM/Kasthuri++/Test_Out"

# results + experiment naming
experiment_id: "2026-02-27_kasthuri_openclip_vitl14_head_seg"
results_root: "${results_root}/openclip"
task_type: "seg/kasthuri-head"

# Kasthuri follows Lucchi-style pairing (numeric stems; no image prefix)
dataset:
  type: lucchi
  params:
    recursive: false
    image_prefix: ""
    zfill_width: 4

# ---- model / backbone ----
backbone:
  name: openclip
  model: "ViT-L-14"
  pretrained: "laion2b_s32b_b82k"
  weights: ""
  preprocess:
    preset: em
dino_size: "ViT-L-14"
img_size:
  mode: longest_edge
  target: 1022
  patch_multiple: 14
  rounding: floor
num_classes: 2

# ---- fine-tuning ----
use_lora: false
full_finetune: false
lora:
  enabled: false
  target_policy: vit_attention_only
  layer_selection: all
  exclude: [head, decoder, seg_head]
  compatibility_mode: true

# ---- loss ----
class_weights: [1.0, 15.0]
