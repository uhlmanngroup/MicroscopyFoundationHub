# Environment: cluster (UZH Science) - DeepBacs single dataset

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/deepbacs/single/subtilis/train/images"
train_mask_dir: "${data_root}/deepbacs/single/subtilis/train/masks"
test_img_dir: "${data_root}/deepbacs/single/subtilis/test/images"
test_mask_dir: "${data_root}/deepbacs/single/subtilis/test/masks"

# ---- results ----
experiment_id: "2026-03-18_deepbacs_subtilis_dinov2_fullft_seg"
results_root: "${results_root}/dinov2"
task_type: "seg/single/subtilis-fullft"
modality: "deepbacs"

dataset:
  type: paired
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: dinov2
  variant: base
  load_backend: torchhub
  weights: null
  repo_dir: null
  preprocess:
    preset: em
dino_size: base
img_size:
  mode: native
num_classes: 2

# ---- fine-tuning ----
use_lora: false
full_finetune: true

# ---- safety / export ----
binarize_threshold: 0
