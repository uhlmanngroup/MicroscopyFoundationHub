# Smoke test — MoNuSAC Epithelial, DINOv3-L/16, head-only, 5 epochs
# Purpose: verify pipeline runs end-to-end, check figure sizes and outputs

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/monusac_448/epithelial/train/images"
train_mask_dir: "${data_root}/monusac_448/epithelial/train/masks"
test_img_dir: "${data_root}/monusac_448/epithelial/test/images"
test_mask_dir: "${data_root}/monusac_448/epithelial/test/masks"

# ---- results ----
experiment_id: "2026-09-14_monusac_epithelial_dinov3_head_smoketest"
results_root: "${scratch_root}/dinov3"
task_type: "seg/epithelial-smoketest"
modality: "monusac"

dataset:
  type: paired
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: dinov3
  variant: vitl16
  load_backend: torchhub
  repo_dir: ${dinov3_repo}
  weights: ${models_root}/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  preprocess:
    preset: em
dino_size: vitl16
img_size:
  mode: native
num_classes: 2

# ---- fine-tuning: head only ----
use_lora: false
full_finetune: false

# ---- training: minimal ----
epochs: 5
patience: 999

# ---- eval previews ----
eval_preview_n: 4
eval_preview_seed: 42
eval_preview_mode: random
eval_preview_cols: 4
