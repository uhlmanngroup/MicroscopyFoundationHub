# Environment: cluster (UZH Science) - Kasthuri-only segmentation run
# DINOv3 LoRA config.

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/EM/Kasthuri++/Train_In"
train_mask_dir: "${data_root}/EM/Kasthuri++/Train_Out"
test_img_dir:  "${data_root}/EM/Kasthuri++/Test_In"
test_mask_dir: "${data_root}/EM/Kasthuri++/Test_Out"

# results + experiment naming
experiment_id: "2026-02-27_kasthuri_dinov3_lora_seg"
results_root: "${results_root}/dinov3/seg"
task_type: "kasthuri-lora"

# Kasthuri follows Lucchi-style pairing (numeric stems; no image prefix)
dataset:
  type: lucchi
  params:
    recursive: false
    image_prefix: ""
    zfill_width: 4

# ---- model / backbone ----
backbone:
  name: dinov3
  variant: vitl16
  load_backend: torchhub
  repo_dir: ${dinov3_repo}
  weights: ${models_root}/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  preprocess:
    preset: em
dino_size: vitl16
img_size:
  mode: longest_edge
  target: 1022
  patch_multiple: 16
  rounding: floor
num_classes: 2

# ---- LoRA ----
use_lora: true
full_finetune: false
lora:
  enabled: true
  target_policy: vit_attention_only
  layer_selection: all
  exclude: [head, decoder, seg_head]
  compatibility_mode: true

# ---- loss ----
class_weights: [1.0, 15.0]
