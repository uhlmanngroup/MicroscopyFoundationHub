# Environment: cluster (UZH Science) - DeepBacs triplet dataset

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/deepbacs/triplet/train/images"
train_mask_dir: "${data_root}/deepbacs/triplet/train/masks"
test_img_dir: "${data_root}/deepbacs/triplet/test/images"
test_mask_dir: "${data_root}/deepbacs/triplet/test/masks"

# ---- results ----
experiment_id: "2026-03-03_deepbacs_triple_coli-aureus-subtilis_dinov3_lora_seg"
results_root: "${scratch_root}/dinov3/seg"
task_type: "coli-aureus-subtilis-lora"
modality: "deepbacs"

dataset:
  type: paired
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: dinov3
  variant: vitl16
  load_backend: torchhub
  repo_dir: ${dinov3_repo}
  weights: ${models_root}/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  preprocess:
    preset: em
dino_size: vitl16
img_size:
  mode: native
num_classes: 2

# ---- fine-tuning ----
use_lora: true
# NOTE: these runs used the implicit LoRA fallback (rank 8, alpha 16), not the
# rank 16 / alpha 32 used by the EM and OpenCLIP configs. Pinned explicitly so the
# value is visible and unchanged; see git history before altering.
lora_rank: 8
lora_alpha: 16

full_finetune: false

# ---- safety / export ----
binarize_threshold: 0
