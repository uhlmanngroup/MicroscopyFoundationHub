# Environment: cluster (UZH Science) - composed paired dataset
# Full fine-tuning config (no LoRA).

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/EM/TRIPLET/train/images"
train_mask_dir: "${data_root}/EM/TRIPLET/train/masks"
test_img_dir:    "${data_root}/EM/TRIPLET/test/images"
test_mask_dir:   "${data_root}/EM/TRIPLET/test/masks"

# results + experiment naming
experiment_id: "2026-02-18_A2_dinopoc_fullft_DA_seg"
results_root: "${results_root}/dinov2"
task_type: "seg/triplet-fullft"

# stitched dataset already shares a naming scheme between images/masks
dataset:
  type: paired          # use generic PairedDirsSegDataset
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: dinov2
  variant: base
  load_backend: torchhub
  weights: null
  repo_dir: null
  preprocess:
    preset: em

dino_size: base
img_size:
  mode: longest_edge
  target: 1022   # largest <= 1024 while staying multiple of 14
  patch_multiple: 14
  rounding: floor
num_classes: 2

# ---- fine-tuning ----
use_lora: false
full_finetune: true

# ---- training safety ----
clip_grad_norm: 1.0   # global grad clip
