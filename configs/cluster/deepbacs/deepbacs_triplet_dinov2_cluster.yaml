# Environment: cluster (UZH Science) - DeepBacs triplet dataset

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/deepbacs/triple/coli-aureus-subtilis/train/images"
train_mask_dir: "${data_root}/deepbacs/triple/coli-aureus-subtilis/train/masks"
test_img_dir: "${data_root}/deepbacs/triple/coli-aureus-subtilis/test/images"
test_mask_dir: "${data_root}/deepbacs/triple/coli-aureus-subtilis/test/masks"

# ---- results ----
experiment_id: "2026-03-03_deepbacs_triple_coli-aureus-subtilis_dinov2_lora_seg"
results_root: "${results_root}/dinov2"
task_type: "coli-aureus-subtilis-lora"
modality: "deepbacs"

dataset:
  type: paired
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: dinov2
  variant: base
  load_backend: torchhub
  weights: null
  repo_dir: null
  preprocess:
    preset: em
dino_size: base
img_size:
  mode: native
num_classes: 2

# ---- fine-tuning ----
use_lora: true
# NOTE: these runs used the implicit LoRA fallback (rank 8, alpha 16), not the
# rank 16 / alpha 32 used by the EM and OpenCLIP configs. Pinned explicitly so the
# value is visible and unchanged; see git history before altering.
lora_rank: 8
lora_alpha: 16

full_finetune: false

# ---- safety / export ----
binarize_threshold: 0
