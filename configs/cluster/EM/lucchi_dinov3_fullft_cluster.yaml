# Environment: cluster (UZH Science) - Lucchi++ segmentation run
# DINOv3 LoRA config.

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/EM/Lucchi++/Train_In"
train_mask_dir: "${data_root}/EM/Lucchi++/Train_Out"
test_img_dir:    "${data_root}/EM/Lucchi++/Test_In"
test_mask_dir:   "${data_root}/EM/Lucchi++/Test_Out"

# results + experiment naming (stored under /data to persist on the cluster)
experiment_id: "2026-02-12_A1_lucchi_dinov3-vits16_fullft_seg"
results_root: "${results_root}/dinov3"
task_type: "seg/lucchi-fullft"

# dataset pairing (Lucchi images are named maskXXXX vs masks as digits)
dataset:
  type: lucchi
  params:
    recursive: false
    image_prefix: "mask"
    zfill_width: 4

# ---- model / backbone ----
backbone:
  name: dinov3
  variant: vitl16
  load_backend: torchhub
  repo_dir: ${dinov3_repo}
  weights: ${models_root}/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  preprocess:
    preset: em
dino_size: vitl16
img_size:
  mode: longest_edge
  target: 1022   # largest <= 1024 while staying multiple of 16
  patch_multiple: 16
  rounding: floor
num_classes: 2

full_finetune: true

# ---- LoRA ----
use_lora: false
lora:
  enabled: false
  target_policy: vit_attention_only
  layer_selection: all
  exclude: [head, decoder, seg_head]
  compatibility_mode: true

# ---- training ----
batch_size: 2          # tightened for low-memory smoke tests on standard GPUs
num_workers: 0
amp: false            # first run: stability check without AMP

# ---- loss (CE + Tversky on foreground) ----
loss: dice      # ce, dice, ce_tversky
class_weights: [1.0, 15.0]    # bg, fg
tversky_weight: 0.6   # lambda: 0.6*Tversky + 0.4*CE

# ---- training safety ----
clip_grad_norm: 1.0   # global grad clip
