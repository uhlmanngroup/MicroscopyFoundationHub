# Environment: cluster (UZH Science) — Drosophila-only segmentation run

# Run scripts/data/compose_em_datasets.py on the cluster (or rsync the staged
# droso-only directory) and point these dirs to that output.
extends: defaults

train_img_dir: "${data_root}/EM/Droso/Train_In"
train_mask_dir: "${data_root}/EM/Droso/Train_Out"
test_img_dir:    "${data_root}/EM/Droso/Test_In"
test_mask_dir:   "${data_root}/EM/Droso/Test_Out"

# results + experiment naming (stored under /data to persist on the cluster)
experiment_id: "2025-01-01_A2_droso-only_dinov2-base_lora-r16_seg"
results_root: "${results_root}/dinov2"
task_type: "seg/droso-nolora"

# dataset pairing (drosophila images share numeric stems with their masks)
dataset:
  type: droso
  params:
    recursive: true

# ---- model / backbone ----
backbone:
  name: dinov2
  variant: small
  load_backend: torchhub
  weights: null
  repo_dir: null
  preprocess:
    preset: em
dino_size: small
img_size:
  mode: longest_edge
  target: 1022
  patch_multiple: 14
  rounding: floor
num_classes: 2

# ---- LoRA ----
use_lora: true
lora_targets: [attn.qkv, attn.proj]

# ---- training ----
batch_size: 1
epochs: 1
num_workers: 0

# ---- loss (CE + Tversky on foreground) ----
class_weights: [1.0, 15.0]
