# Environment: cluster (UZH Science) — Droso-only segmentation run (DINOv3)

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/EM/Droso/Train_In"
train_mask_dir: "${data_root}/EM/Droso/Train_Out"
test_img_dir:    "${data_root}/EM/Droso/Test_In"
test_mask_dir:   "${data_root}/EM/Droso/Test_Out"

# results + experiment naming (stored under /data to persist on the cluster)
experiment_id: "2026-01-10_A2_droso-only_dinov3_seg"
results_root: "${results_root}/dinov3"
task_type: "seg/droso-lora"

# dataset pairing (Drosophila images share numeric stems with their masks)
dataset:
  type: droso
  params:
    recursive: true

# ---- model / backbone ----
backbone:
  name: dinov3
  variant: vits16
  load_backend: torchhub
  repo_dir: ${dinov3_repo}
  weights: ${models_root}/dinov3/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  preprocess:
    preset: em
dino_size: vits16
img_size:
  mode: longest_edge
  target: 1022   # largest <= 1024 while staying multiple of 16
  patch_multiple: 16
  rounding: floor
num_classes: 2

# ---- LoRA ----
use_lora: true
lora:
  enabled: true
  target_policy: vit_attention_only
  layer_selection: all
  exclude: [head, decoder, seg_head]
  compatibility_mode: true

# ---- training ----
batch_size: 1
epochs: 500

# ---- loss (CE + Tversky on foreground) ----
class_weights: [1.0, 15.0]
