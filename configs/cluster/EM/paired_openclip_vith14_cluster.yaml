# Environment: cluster (UZH Science) - composed DINO-POC dataset
# OpenCLIP ViT-H-14 config.

extends: defaults

# ---- I/O ----
train_img_dir: "${data_root}/EM/DINO-POC/train/images"
train_mask_dir: "${data_root}/EM/DINO-POC/train/masks"
test_img_dir:    "${data_root}/EM/DINO-POC/test/images"
test_mask_dir:   "${data_root}/EM/DINO-POC/test/masks"

# results + experiment naming
experiment_id: "2026-01-26_dinopoc_openclip_vith14_WITHlora-r16_seg"
results_root: "${results_root}"
task_type: "seg"

# stitched dataset already shares a naming scheme between images/masks
dataset:
  type: paired
  params:
    pair_mode: stem
    recursive: false

# ---- model / backbone ----
backbone:
  name: openclip
  model: "ViT-H-14"
  pretrained: "laion2b_s32b_b79k"
  weights: ""
  preprocess:
    preset: em
dino_size: "ViT-H-14"
img_size:
  mode: longest_edge
  target: 1022   # largest <= 1024 while staying multiple of 14
  patch_multiple: 14
  rounding: floor
num_classes: 2

# ---- LoRA ----
use_lora: true
lora:
  enabled: true
  target_policy: vit_attention_only
  layer_selection: all
  exclude: [head, decoder, seg_head]
  compatibility_mode: true

# ---- training ----
epochs: 80

# ---- loss (Dice) ----
class_weights: [1.0, 15.0]
